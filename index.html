<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Grade Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Grade Calculator</h1>

        <p>Enter the student's marks to calculate the result.</p>

        <label for="studentName">Student Name</label>
        <input type="text" id="studentName" placeholder="Enter your name">

        <label for="mark1">Subject 1</label>
        <input type="number" id="mark1" placeholder="Enter mark" min="0" max="100">

        <label for="mark2">Subject 2</label>
        <input type="number" id="mark2" placeholder="Enter mark" min="0" max="100">

        <label for="mark3">Subject 3</label>
        <input type="number" id="mark3" placeholder="Enter mark" min="0" max="100">

        <label for="mark4">Subject 4</label>
        <input type="number" id="mark4" placeholder="Enter mark" min="0" max="100">

        <label for="mark5">Subject 5</label>
        <input type="number" id="mark5" placeholder="Enter mark" min="0" max="100">

        <button onclick="calculateGrade()">Calculate Result</button>

        <div id="result" class="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
